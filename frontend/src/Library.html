        .library-container {
    display: flex;
    flex-direction: column;
    gap: 2rem;
    padding: 1rem;
  }
  
  .database-section {
    margin-bottom: 2rem;
  }
  
  .database-section h2 {
    margin-bottom: 1rem;
    color: #333;
    font-size: 1.5rem;
  }
  
  .library-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
    gap: 1.5rem;
  }
  
  .database-card {
    background: white;
    border-radius: 8px;
    padding: 1.5rem;
    box-shadow: 0 2px 4px #2f9d94;
    ;
    cursor: pointer;
    transition: transform 0.2s, box-shadow 0.2s;
  }
  
  .database-card:hover {
    transform: translateY(-2px);
    box-shadow: 0 4px 8px #ff8c32;
  }
  
  .database-card h3 {
    margin: 0 0 0.5rem 0;
    color: #2c3e50;
  }
  
  .database-card p {
    margin: 0;
    color: #7f8c8d;
    font-size: 0.9rem;
  }
