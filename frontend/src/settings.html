      <main class="main-content">
        <section class="settings-panel">
          <header class="settings-tabs">
            <nav aria-label="Settings navigation">
              <ul class="tab-list">
                <li class="tab-item active">
                  <a href="#" class="tab-link">Account Setting</a>
                </li>
                <li class="tab-item">
                  <a href="#" class="tab-link">Notifications</a>
                </li>
              </ul>
            </nav>
          </header>

          <form class="settings-form" aria-label="User profile settings">
            <section class="profile-picture-section">
              <h2 class="section-label">Your Profile Picture</h2>
              <button
                type="button"
                class="upload-button"
                aria-label="Upload profile picture"
              >
                <span class="icon-wrapper">
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    class="upload-icon"
                    viewBox="0 0 24 24"
                    stroke-width="2"
                    stroke="currentColor"
                    fill="none"
                  >
                    <path stroke="none" d="M0 0h24v24H0z" fill="none"></path>
                    <path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2 -2v-2"></path>
                    <path d="M7 9l5 -5l5 5"></path>
                    <path d="M12 4l0 12"></path>
                  </svg>
                </span>
              </button>
            </section>

            <div class="form-row">
              <div class="form-group">
                <label for="fullName" class="form-label">Full name</label>
                <input
                  type="text"
                  id="fullName"
                  placeholder="Please enter your full name"
                  class="form-input"
                />
              </div>
              <div class="form-group">
                <label for="email" class="form-label">Email</label>
                <input
                  type="email"
                  id="email"
                  placeholder="Please enter your email"
                  class="form-input"
                />
              </div>
            </div>

            <div class="form-row">
              <div class="form-group">
                <label for="username" class="form-label">Username</label>
                <input
                  type="text"
                  id="username"
                  placeholder="Please enter your username"
                  class="form-input"
                />
              </div>
              <div class="form-group">
                <label for="phoneNumber" class="form-label">Phone number</label>
                <div class="phone-input-group">
                  <div class="country-code">+1</div>
                  <input
                    type="tel"
                    id="phoneNumber"
                    placeholder="Please enter your phone number"
                    class="phone-input"
                  />
                </div>
              </div>
            </div>

            <div class="form-group bio-group">
              <label for="bio" class="form-label">Bio</label>
              <textarea
                id="bio"
                placeholder="Write your bio here e.g your hobbies, interests ETC"
                class="form-textarea"
              ></textarea>
            </div>

            <div class="form-actions">
              <button type="submit" class="btn btn-primary">
                Update Profile
              </button>
              <button type="reset" class="btn btn-secondary">Reset</button>
            </div>
          </form>
        </section>
      </main>
    </div>
  </body>
</html>
