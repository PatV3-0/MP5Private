name: CLI Pipeline

on:
  push:
    branches: [ "clidev" ]
  pull_request:
    branches: [ "clidev" ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    outputs:
      tests_passed: ${{ steps.set-status.outputs.tests_passed }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Update submodules
        run: git submodule update --init --recursive

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install dependencies
        run: npm ci
        working-directory: cli

      - name: Install dev dependencies
        run: |
          npm install --save-dev \
            jest @types/jest ts-jest \
            eslint @typescript-eslint/parser @typescript-eslint/eslint-plugin
        working-directory: cli

      - name: Lint code
        run: npm run lint
        working-directory: cli

      - name: Run unit tests
        run: npm test
        working-directory: cli

      - name: Generate coverage report
        run: npm test -- --coverage
        working-directory: cli

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: cli-coverage
          path: cli/coverage/

  build:
    runs-on: ubuntu-latest
    needs: test
    if: success()  # Only runs if test job succeeded

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Update submodules
        run: git submodule update --init --recursive

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install dependencies
        run: npm ci
        working-directory: cli

      - name: Build project
        run: npm run build
        working-directory: cli