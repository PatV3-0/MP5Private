name: API CI Pipeline

on:
  push:
    branches: [ "rest-api" ]
  pull_request:
    branches: [ "rest-api" ]
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci
        working-directory: rest-api

      - name: Lint code
        run: |
          if [ -f .eslintrc.js ] || [ -f .eslintrc.json ]; then
            npx eslint .
          else
            echo "No ESLint config found; skipping linting"
          fi
        working-directory: rest-api

      - name: Run unit tests
        run: npx jest --detectOpenHandles
        working-directory: rest-api

      - name: Generate coverage report
        run: npx jest --coverage
        working-directory: rest-api

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: api-coverage
          path: rest-api/coverage/

      - name: Build API (only if tests pass)
        run: |
          if [ -f tsconfig.json ]; then
            npx tsc
          elif [ -f webpack.config.js ]; then
            npx webpack
          else
            echo "No build step detected; skipping"
          fi
        working-directory: rest-api
