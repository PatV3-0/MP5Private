name: API CI Pipeline

on:
  push:
    branches: [ "api" ]
  pull_request:
    branches: [ "api" ]
  workflow_dispatch:

jobs:
  api-unit-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with: 
          node-version: 18

      - name: Install dependencies
        run: npm ci
        working-directory: rest-api

      - name: Run unit tests
        run: npm test
        working-directory: rest-api

      - name: Generate coverage report
        run: npm test -- --coverage
        working-directory: rest-api

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: api-coverage
          path: rest-api/coverage/
