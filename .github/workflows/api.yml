name: API CI Pipeline

on:
  push:
    branches: [ "rest-api" ]
  pull_request:
    branches: [ "rest-api" ]
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18' # Adjust as needed

      - name: Install dependencies
        run: npm install

      - name: Lint code
        run: |
          if [ -f .eslintrc.js ] || [ -f .eslintrc.json ]; then
            npx eslint .
          else
            echo "No ESLint config found; skipping linting"
          fi

      - name: Run unit tests
        run: npm test

      - name: Generate coverage report (if configured)
        run: |
          if [ -f jest.config.js ] || [ -f jest.config.ts ]; then
            npx jest --coverage
          elif [ -d coverage ]; then
            echo "Coverage output exists"
          else
            echo "No coverage tools found; skipping"
          fi

      - name: Build API (only if tests pass)
        run: |
          if [ -f tsconfig.json ]; then
            npx tsc
          elif [ -f webpack.config.js ]; then
            npx webpack
          else
            echo "No build step detected; skipping"
          fi
