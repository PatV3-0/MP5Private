name: Full Stack CI Pipeline

on:
  push:
    branches: [apidev]
  pull_request:
    branches: [apidev]
  workflow_dispatch:

jobs:
  setup-API:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with: 
          node-version: 18

      - name: Install dependencies
        run: npm install
        working-directory: rest-api

      - name: Install dotenv
        run: npm install dotenv
        working-directory: rest-api

      - name: Install Jest
        run: npm install --save-dev jest
        working-directory: rest-api

      - name: Run tests
        run: npm test
        working-directory: rest-api

  build-API:
    runs-on: ubuntu-latest
    needs: setup-API

    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install
        working-directory: rest-api

      - name: Run tests
        run: npm test
        working-directory: rest-api


  # Second Job: Full-stack Docker-based integration tests
  build-and-test-Docker:
    needs: build-API
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v3

    - name: Set up Docker Compose
      run: docker compose version

    - name: Convert setup script line endings (if needed)
      run: |
        sudo apt-get update && sudo apt-get install -y dos2unix
        dos2unix setup.sh

    - name: Export auth token for Docker
      run: echo "MP5_SECRET_TOKEN=${{ secrets.MP5_SECRET_TOKEN }}" > .env

    - name: Build and start containers
      run: docker compose up --build -d

    - name: Wait for services to be ready
      run: sleep 15

    - name: Test Daemon (port 5000)
      run: |
        nc -zv localhost 5000 || (echo "❌ Daemon not responding on port 5000" && exit 1)

    - name: Test REST API /getDatabases (port 3000)
      run: |
        RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" -X POST http://localhost:3000/getDatabases \
        -H "Content-Type: application/json" \
        -d '{"payload": {"apiKey": "testkey"}}')
        echo "HTTP response: $RESPONSE"
        [ "$RESPONSE" -eq 200 ] || (echo "❌ REST API test failed with code $RESPONSE" && exit 1)
      
    - name: Test Web Frontend (Apache on port 8080)
      run: |
        curl -s http://localhost:8080 | grep -i "<html" || (echo "❌ Web frontend not served properly" && exit 1)

    - name: Shut down containers
      if: always()
      run: docker compose down
